[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aiperfopt"
version = "0.1.0"
description = "AI-powered predictive performance optimizer for Windows and macOS"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }

dependencies = [
    # --- Configuration / logging (Phase 0) ---
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",

    # --- Storage (Phase 0 / Phase 1) ---
    "sqlalchemy>=2.0,<3",

    # --- Monitoring (Phase 2) ---
    "psutil>=5.9",

    # --- Feature engineering / general data handling (Phase 3+) ---
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",

    # --- Forecasting / classical baselines / evaluation (Phase 4) ---
    "lightgbm>=4.3,<5",
    "scikit-learn>=1.4,<2",
    "joblib>=1.3",
    "statsmodels>=0.14,<1",

    # --- Explainability (Phase 6) ---
    "shap>=0.45,<1",

    # --- Evaluation/ablation reporting (Phase 5): PR curve, confusion
    # matrix, and feature-importance plots for the Review 2 evidence pack.
    "matplotlib>=3.8,<4",

    # --- API layer (Phase 9) ---
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.29",
    "websockets>=12.0",

    # The web dashboard is static HTML/JS served by the API: no extra deps.
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",  # FastAPI's TestClient
    "pyinstaller>=6.5", # packaging, per Section 19
    # Without this a hung test blocks the whole run instead of failing.
    "pytest-timeout>=2.3",
]

[project.scripts]
aiperfopt = "aiperfopt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# The YAML config lives inside the package (src/aiperfopt/resources) so it
# is present in a built wheel and a PyInstaller bundle. It previously sat
# in a top-level config/ directory that no distribution ever included --
# every non-editable install died at load_settings().
[tool.setuptools.package-data]
aiperfopt = ["resources/*.yaml", "web/static/*", "web/static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# A single hung test must not stall the whole suite. Generous enough not
# to fire on real ML fitting.
timeout = 300
addopts = "--strict-markers"
markers = [
    "behavioural: asserts a computed value, decision, or output is correct (fails when logic degrades, not just when code errors)",
    "plumbing: asserts only that code executed, wiring/DI/config is correct, or a record/thread/call happened (no correctness claim about the value)",
]
