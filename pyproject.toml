[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aiperfopt"
version = "0.1.0"
description = "AI-powered predictive performance optimizer for macOS (course project, see PROJECT_SPEC.md)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

dependencies = [
    # --- Configuration / logging (Phase 0) ---
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",

    # --- Storage (Phase 0 / Phase 1) ---
    "sqlalchemy>=2.0",

    # --- Monitoring (Phase 2) ---
    "psutil>=5.9",

    # --- Feature engineering / general data handling (Phase 3+) ---
    "pandas>=2.2",
    "numpy>=1.26",

    # --- Forecasting / classical baselines / evaluation (Phase 4) ---
    "lightgbm>=4.3",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "statsmodels>=0.14",

    # --- Explainability (Phase 6) ---
    "shap>=0.45",

    # --- API layer (Phase 9) ---
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "websockets>=12.0",

    # --- Frontend (Phase 10) ---
    "pyside6>=6.6",
    # httpx is the frontend's REST client (api_client.py) at runtime, not
    # just a FastAPI TestClient dependency -- promoted out of [dev] now
    # that Phase 10 actually ships code that imports it outside tests.
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-qt>=4.4",  # PySide6 widget testing (Phase 10), offscreen-capable
    "pyinstaller>=6.5", # packaging, per Section 19
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
