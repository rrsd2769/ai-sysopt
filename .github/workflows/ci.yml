name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS only, by decision: this project targets macOS for the
        # remainder of its scope. The code stays portable by construction,
        # but Windows is no longer tested or claimed -- see
        # docs/plans/2026-09-12-presentable-predictive-monitor.md.
        os: [macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Doctor (proves the install is usable, not just importable)
        run: aiperfopt doctor

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Python tests
        run: python -m pytest -q

      - name: Dashboard JS tests
        run: node --test src/aiperfopt/web/static/js/

  wheel:
    name: wheel contains its config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Assert packaged YAML is present
        # The original wheel contained 101 files and zero .yaml, so every
        # non-editable install died at load_settings(). Never again.
        run: |
          python - <<'PY'
          import glob, sys, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          yaml = [n for n in names if n.endswith(".yaml")]
          print(f"{wheel}: {len(names)} files, yaml={yaml}")
          if len(yaml) < 2:
              sys.exit("packaged YAML missing from the wheel")
          PY
